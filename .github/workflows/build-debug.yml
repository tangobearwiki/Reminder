name: Build Debug APK

on:
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.properties'
      - 'gradle/**'
      - 'app/**'

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Remove signing config (debug build)
        run: |
          # 删除 signingConfigs 引用，debug 编译不需要签名
          sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts
          echo "Removed signing config for debug build"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error